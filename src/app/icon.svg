<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />

  <!-- Subtle inner glow border -->
  <rect width="62" height="62" x="1" y="1" rx="13" ry="13" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- "E" letter — left side -->
  <!-- Vertical bar -->
  <rect x="9" y="16" width="5" height="32" rx="1.5" fill="url(#text-grad)" />
  <!-- Top horizontal bar -->
  <rect x="9" y="16" width="16" height="5" rx="1.5" fill="url(#text-grad)" />
  <!-- Middle horizontal bar -->
  <rect x="9" y="29.5" width="13" height="4.5" rx="1.5" fill="url(#text-grad)" />
  <!-- Bottom horizontal bar -->
  <rect x="9" y="43" width="16" height="5" rx="1.5" fill="url(#text-grad)" />

  <!-- "O" letter — right side (open oval) -->
  <ellipse cx="45" cy="32" rx="10" ry="13" fill="none" stroke="url(#text-grad)" stroke-width="5" />
</svg>

