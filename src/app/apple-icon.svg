<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="180" height="180" rx="40" ry="40" fill="url(#bg)" />

  <!-- Inner glow border -->
  <rect width="176" height="176" x="2" y="2" rx="38" ry="38" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- "E" letter -->
  <rect x="24" y="44" width="14" height="92" rx="4" fill="url(#text-grad)" />
  <rect x="24" y="44" width="46" height="14" rx="4" fill="url(#text-grad)" />
  <rect x="24" y="83" width="38" height="13" rx="4" fill="url(#text-grad)" />
  <rect x="24" y="122" width="46" height="14" rx="4" fill="url(#text-grad)" />

  <!-- "O" letter -->
  <ellipse cx="128" cy="90" rx="28" ry="37" fill="none" stroke="url(#text-grad)" stroke-width="14" />
</svg>
